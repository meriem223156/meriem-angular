<div class="container">
    <h1>Détails de la Suggestion</h1>
    <div *ngIf="user">
        <h2>{{ user.id }}</h2>
        <p>{{ user.name }}</p>
         <p>{{ user.email }}</p>
         <p>{{ user.role }}</p>
         
        <p><strong>Statut:</strong> {{ user.status }}</p>
        <p><strong>Date de création:</strong> {{ user.created_at | date }}</p>
    </div>
        

</div>
